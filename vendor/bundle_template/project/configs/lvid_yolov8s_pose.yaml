seed: 2026

data:
  root: .
  prepared_dir: prepared_lvid
  yolo_dir: prepared_lvid_yolo_pose
  yolo_data: prepared_lvid_yolo_pose/data.yaml
  train_labels: prepared_lvid/labels/train.csv
  val_labels: prepared_lvid/labels/val.csv
  test_labels: prepared_lvid/labels/test.csv
  input_height: 384
  input_width: 512

model:
  name: yolo_pose
  weights: yolov8s-pose.pt

train:
  run_dir: runs/lvid_yolov8s_pose
  epochs: 80
  batch_size: 8
  imgsz: 512
  patience: 10
  device: 0
  workers: 0
  optimizer: AdamW
  lr0: 0.001
  weight_decay: 0.0005
  cos_lr: true
  amp: true
  plots: true
  save_period: 10

augment:
  degrees: 8.0
  translate: 0.04
  scale: 0.08
  shear: 0.0
  perspective: 0.0
  fliplr: 0.0
  flipud: 0.0
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  erasing: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.12

eval:
  conf: 0.01
  overlay_count: 64
